[package]
name = "rezka_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "rezka_core"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "brotli", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.20"
regex = "1"
thiserror = "1"
urlencoding = "2"

[profile.release]
lto = true
codegen-units = 1
